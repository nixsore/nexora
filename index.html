function lessonUI(){document.body.classList.add('inl');const q=L.q[L.i],f=L.fb;let b='';
if(q.t=='mc')b=q.o.map((o,i)=>`<button class="opt ${L.sel===i?'sel':''} ${f&&i==q.c?'ok':''} ${f&&L.sel===i&&!f.ok?'no':''}" dir="auto" ${f?'':`onclick="pick(${i})"`}>${o}</button>`).join('');
if(q.t=='ty')b=`<input id="ti" dir="auto" autocapitalize="off" autocomplete="off" placeholder="اكتب هنا..." ${f?'disabled':''} value="${f?f.v.replace(/"/g,''):''}">`+(S.l=='es'&&!f?`<div class="kb" dir="ltr">${[...'ñáéíóú¿¡'].map(c=>`<button class="chip" onmousedown="event.preventDefault()" onclick="ins('${c}')">${c}</button>`).join('')}</div>`:'');
if(q.t=='or')b=`<div class="ansbox" dir="ltr">${L.ans.map(i=>`<button class="chip" ${f?'':`onclick="unchip(${i})"`}>${q.p[i]}</button>`).join('')}</div><div class="pool" dir="ltr">${q.p.map((w,i)=>L.ans.includes(i)?'':`<button class="chip" ${f?'':`onclick="chip(${i})"`}>${w}</button>`).join('')}</div>`;
if(q.t=='sp')b=f?'':`<button id="mic" class="big2" onclick="rec()">🎤 اضغط وانطق</button><button class="secondary big2" onclick="skipSp()">تخطي (لا أستطيع الآن)</button>`;
if(q.t=='mt')b=`<div class="grid"><div dir="ltr">${q.pr.map((w,i)=>`<button class="opt ${q.dn.includes(i)?'ok':q.sel===i?'sel':''}" ${q.dn.includes(i)?'':`onclick="mtp(0,${i})"`}>${w[0]}</button>`).join('')}</div><div>${q.r.map(i=>`<button class="opt ${q.dn.includes(i)?'ok':''}" ${q.dn.includes(i)?'':`onclick="mtp(1,${i})"`}>${q.pr[i][1]}</button>`).join('')}</div></div>`;
$('v').innerHTML=`<div class="lt"><button class="x" onclick="quit()">✕</button><div class="bar"><i style="width:${L.i/L.q.length*100}%"></i></div><span>❤️ ${L.h}</span></div><div class="card"><div class="qs" dir="auto">${q.q}</div></div>${b}`+
(f?`<div class="fb ${f.ok?'g':'r'}"><b>${f.ok?(f.near?'تقريبا صحيح 👌':'ممتاز! ✓'):'إجابة خاطئة ✗'}</b>${f.c&&(!f.ok||f.near)?`<div>الصحيح: <span class="en">${f.c}</span></div>`:''}${q.t=='sp'&&f.v?`<div class="muted">سمعتك: <span class="en">${f.v}</span></div>`:''}${!f.ok&&q.x?`<div class="muted" style="margin-top:6px">💡 ${q.x}</div>`:''}<button onclick="next()">متابعة</button></div>`:q.t=='mt'||q.t=='sp'?'':`<button class="big2" onclick="check()">تحقق</button>`);
if(q.t=='ty'&&!f){$('ti').focus();if(q.d&&!q.pl){q.pl=1;say(q.w[0])}}}
const pick=i=>{L.sel=i;lessonUI()},chip=i=>{L.ans.push(i);lessonUI()},unchip=i=>{L.ans=L.ans.filter(x=>x!=i);lessonUI()};
const ins=c=>{const t=$('ti');t.value+=c;t.focus()};
function mtp(s,i){const q=L.q[L.i];if(s==0){q.sel=i;return lessonUI()}if(q.sel===null)return;
if(q.sel===i){q.dn.push(i);srs(q.pr[i],true);rec0('mt',true);q.sel=null;beep(1);if(q.dn.length==4){L.ok++;L.fb={ok:true,c:'',v:''}}}
else{L.h--;beep(0);srs(q.pr[q.sel],false);rec0('mt',false);addErr(q.pr[q.sel]);q.sel=null;if(L.h<=0)return end(false)}
lessonUI()}
function check(){const q=L.q[L.i];let ok,c,v='',near=false;
if(q.t=='mc'){if(L.sel===null)return;ok=L.sel==q.c;c=q.o[q.c]}
else if(q.t=='ty'){v=$('ti').value;if(!v.trim())return;c=q.a[0];ok=q.a.some(a=>norm(a)==norm(v));if(!ok){near=q.a.some(a=>norm(a).length>3&&lev(norm(a),norm(v))==1);ok=near}}
else{if(!L.ans.length)return;ok=norm(L.ans.map(i=>q.p[i]).join(' '))==norm(q.a[0]);c=q.a[0]}
L.fb={ok,c,v,near};beep(ok);rec0(q.t,ok);if(q.w)srs(q.w,ok);
if(!ok&&q.t=='mc'&&q.w){const c2=C().U.flatMap(u=>u.v).find(w=>w[1]==q.o[L.sel]);if(c2){const cf=Q().cf;cf.unshift([q.w,c2]);cf.length=Math.min(cf.length,20)}}
if(ok)L.ok++;else{L.h--;if(q.w)addErr(q.w)}
if(q.s)say(q.s);else if(ok&&q.t!='mc'&&q.t!='ty')say(c);
lessonUI()}
function next(){if(L.h<=0)return end(false);L.i++;L.sel=null;L.ans=[];L.fb=null;if(L.i>=L.q.length)return end(true);lessonUI()}
function end(win){addT();const n=L.q.length,acc=L.ok/n,id=L.u.id;let xp=0,st=0;
if(win){xp=10+L.ok*2;st=acc>=.9?3:acc>=.7?2:1;if(id>=0)Q().done[id]=Math.max(Q().done[id]||0,st);if(id==-2&&S.dc!==T()){xp+=20;S.dc=T()}award(xp)}
L=null;
$('v').innerHTML=`<div class="card hero" style="text-align:center"><div class="big">${win?'🎉 أحسنت!':'💔 نفدت القلوب'}</div>${win?`<div class="stat">+${xp} XP</div><div style="font-size:32px">${'⭐'.repeat(st)}</div><p class="muted">الدقة ${Math.round(acc*100)}%</p>`:`<p class="muted">لا بأس، الأخطاء طريق التعلم. حاول مرة أخرى.</p>`}</div><button class="big2" onclick="${win?'draw()':`start(${id})`}">${win?'متابعة':'إعادة المحاولة'}</button>`}
function quit(){if(!L||confirm('الخروج؟ سيضيع تقدم هذا الدرس.')){addT();draw()}}
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!L)return;L.fb?next():(!['mt','sp'].includes(L.q[L.i].t)&&check())});
loadHash();draw();
if('serviceWorker' in navigator&&/^http/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
